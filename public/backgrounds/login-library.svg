<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B4FA8"/>
      <stop offset="40%" stop-color="#2FA6C9"/>
      <stop offset="100%" stop-color="#EAFBFF"/>
    </linearGradient>

    <linearGradient id="lightWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.14"/>
    </linearGradient>

    <radialGradient id="loginArea" cx="72%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="bokeh" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#06214D" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- base gradient -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#bg)"/>

  <!-- soft light wash -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#lightWash)"/>

  <!-- blurry shelves (left side, like library) -->
  <g opacity="0.34" filter="url(#softBlur)">
    <rect x="0" y="130" width="720" height="780" rx="28" fill="#0A2E5A"/>
    <g opacity="0.55">
      <rect x="60" y="200" width="600" height="60" rx="14" fill="#EAF6FF"/>
      <rect x="60" y="300" width="600" height="60" rx="14" fill="#EAF6FF"/>
      <rect x="60" y="400" width="600" height="60" rx="14" fill="#EAF6FF"/>
      <rect x="60" y="500" width="600" height="60" rx="14" fill="#EAF6FF"/>
      <rect x="60" y="600" width="600" height="60" rx="14" fill="#EAF6FF"/>
      <rect x="60" y="700" width="600" height="60" rx="14" fill="#EAF6FF"/>
      <rect x="60" y="800" width="600" height="60" rx="14" fill="#EAF6FF"/>
    </g>
  </g>

  <!-- desk surface (bottom) -->
  <path d="M0,820 C380,760 520,900 980,860 C1380,825 1590,760 1920,820 L1920,1080 L0,1080 Z"
        fill="#0A2E5A" opacity="0.22"/>
  <path d="M0,845 C420,790 560,920 980,885 C1400,850 1620,790 1920,845 L1920,1080 L0,1080 Z"
        fill="#FFFFFF" opacity="0.22" filter="url(#softBlur)"/>

  <!-- study items (left-mid, blurred) -->
  <g opacity="0.50" filter="url(#softBlur)">
    <!-- notebook -->
    <rect x="760" y="760" width="280" height="170" rx="18" fill="#FFFFFF"/>
    <rect x="780" y="780" width="240" height="18" rx="9" fill="#0B4FA8" opacity="0.32"/>
    <rect x="780" y="815" width="240" height="18" rx="9" fill="#0B4FA8" opacity="0.22"/>
    <rect x="780" y="850" width="240" height="18" rx="9" fill="#0B4FA8" opacity="0.18"/>

    <!-- laptop -->
    <rect x="470" y="720" width="260" height="170" rx="16" fill="#0B2C4D" opacity="0.55"/>
    <rect x="495" y="745" width="210" height="120" rx="12" fill="#EAF6FF" opacity="0.52"/>
    <rect x="450" y="890" width="300" height="28" rx="14" fill="#0B2C4D" opacity="0.55"/>

    <!-- pen -->
    <rect x="1060" y="818" width="240" height="16" rx="8" fill="#1E8F62" opacity="0.65"/>
  </g>

  <!-- bokeh -->
  <g opacity="0.20" filter="url(#bokeh)">
    <circle cx="330" cy="240" r="80" fill="#FFFFFF"/>
    <circle cx="540" cy="330" r="55" fill="#E8FFF6"/>
    <circle cx="1220" cy="210" r="95" fill="#FFFFFF"/>
    <circle cx="1520" cy="310" r="70" fill="#EAF6FF"/>
    <circle cx="1780" cy="650" r="110" fill="#FFFFFF"/>
    <circle cx="1040" cy="980" r="140" fill="#FFFFFF"/>
  </g>

  <!-- login area spotlight (center-right) -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#loginArea)"/>

  <!-- subtle silhouette hints (non-identifiable) -->
  <g opacity="0.22" filter="url(#softBlur)">
    <path d="M1180,610 C1180,550 1218,510 1270,510 C1322,510 1360,550 1360,610 C1360,675 1320,725 1270,725 C1220,725 1180,675 1180,610 Z"
          fill="#0A2E5A"/>
    <path d="M980,640 C980,585 1015,550 1062,550 C1109,550 1144,585 1144,640 C1144,700 1110,742 1062,742 C1014,742 980,700 980,640 Z"
          fill="#0A2E5A" opacity="0.9"/>
  </g>

  <!-- gentle vignette -->
  <rect x="0" y="0" width="1920" height="1080" fill="#04162B" opacity="0.10"/>
</svg>
