<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B4FA8"/>
      <stop offset="55%" stop-color="#3AA3D9"/>
      <stop offset="100%" stop-color="#EAF6FF"/>
    </linearGradient>

    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DDF6EA"/>
      <stop offset="100%" stop-color="#BFE9D6"/>
    </linearGradient>

    <linearGradient id="building" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7FBFF"/>
      <stop offset="100%" stop-color="#D9E7F5"/>
    </linearGradient>

    <linearGradient id="greenAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33C481"/>
      <stop offset="100%" stop-color="#1E8F62"/>
    </linearGradient>

    <radialGradient id="cardSpot" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="bokeh" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#sky)"/>

  <!-- distant clouds -->
  <g opacity="0.32" filter="url(#softBlur)">
    <ellipse cx="320" cy="220" rx="210" ry="70" fill="#FFFFFF"/>
    <ellipse cx="470" cy="215" rx="160" ry="60" fill="#FFFFFF"/>
    <ellipse cx="1520" cy="190" rx="260" ry="85" fill="#FFFFFF"/>
    <ellipse cx="1680" cy="200" rx="180" ry="65" fill="#FFFFFF"/>
  </g>

  <!-- ground -->
  <path d="M0,760 C360,690 560,820 960,790 C1320,765 1520,690 1920,760 L1920,1080 L0,1080 Z" fill="url(#ground)"/>

  <!-- campus building group (slightly left so center stays clean) -->
  <g transform="translate(120,110)">
    <!-- shadow -->
    <path d="M340,670 C530,630 820,650 1040,700 C1130,720 1250,770 1340,820 L1340,870 L300,870 Z"
          fill="#0A2E5A" opacity="0.12" filter="url(#softBlur)"/>

    <!-- main block -->
    <rect x="340" y="260" width="980" height="520" rx="18" fill="url(#building)"/>
    <rect x="340" y="260" width="980" height="520" rx="18" fill="#0B4FA8" opacity="0.06"/>

    <!-- green accent facade -->
    <rect x="840" y="260" width="160" height="520" rx="14" fill="url(#greenAccent)" opacity="0.95"/>
    <rect x="860" y="300" width="120" height="70" rx="12" fill="#FFFFFF" opacity="0.14"/>
    <rect x="860" y="400" width="120" height="70" rx="12" fill="#FFFFFF" opacity="0.14"/>
    <rect x="860" y="500" width="120" height="70" rx="12" fill="#FFFFFF" opacity="0.14"/>
    <rect x="860" y="600" width="120" height="70" rx="12" fill="#FFFFFF" opacity="0.14"/>

    <!-- side wing -->
    <rect x="180" y="340" width="220" height="440" rx="16" fill="#F2F8FF"/>
    <rect x="180" y="340" width="220" height="440" rx="16" fill="#0B4FA8" opacity="0.05"/>

    <!-- windows -->
    <g opacity="0.35">
      <g fill="#0B2C4D">
        <!-- left wing windows -->
        <rect x="215" y="390" width="55" height="38" rx="6"/>
        <rect x="295" y="390" width="55" height="38" rx="6"/>
        <rect x="215" y="450" width="55" height="38" rx="6"/>
        <rect x="295" y="450" width="55" height="38" rx="6"/>
        <rect x="215" y="510" width="55" height="38" rx="6"/>
        <rect x="295" y="510" width="55" height="38" rx="6"/>
        <rect x="215" y="570" width="55" height="38" rx="6"/>
        <rect x="295" y="570" width="55" height="38" rx="6"/>
        <rect x="215" y="630" width="55" height="38" rx="6"/>
        <rect x="295" y="630" width="55" height="38" rx="6"/>
      </g>
    </g>

    <g opacity="0.35" fill="#0B2C4D">
      <!-- main building windows -->
      <g>
        <rect x="410" y="320" width="80" height="48" rx="8"/>
        <rect x="520" y="320" width="80" height="48" rx="8"/>
        <rect x="630" y="320" width="80" height="48" rx="8"/>
        <rect x="740" y="320" width="80" height="48" rx="8"/>
      </g>
      <g>
        <rect x="410" y="400" width="80" height="48" rx="8"/>
        <rect x="520" y="400" width="80" height="48" rx="8"/>
        <rect x="630" y="400" width="80" height="48" rx="8"/>
        <rect x="740" y="400" width="80" height="48" rx="8"/>
      </g>
      <g>
        <rect x="410" y="480" width="80" height="48" rx="8"/>
        <rect x="520" y="480" width="80" height="48" rx="8"/>
        <rect x="630" y="480" width="80" height="48" rx="8"/>
        <rect x="740" y="480" width="80" height="48" rx="8"/>
      </g>
      <g>
        <rect x="410" y="560" width="80" height="48" rx="8"/>
        <rect x="520" y="560" width="80" height="48" rx="8"/>
        <rect x="630" y="560" width="80" height="48" rx="8"/>
        <rect x="740" y="560" width="80" height="48" rx="8"/>
      </g>
      <g>
        <rect x="410" y="640" width="80" height="48" rx="8"/>
        <rect x="520" y="640" width="80" height="48" rx="8"/>
        <rect x="630" y="640" width="80" height="48" rx="8"/>
        <rect x="740" y="640" width="80" height="48" rx="8"/>
      </g>
      <!-- right side windows -->
      <g opacity="0.65">
        <rect x="1020" y="320" width="92" height="54" rx="10"/>
        <rect x="1140" y="320" width="92" height="54" rx="10"/>
        <rect x="1020" y="410" width="92" height="54" rx="10"/>
        <rect x="1140" y="410" width="92" height="54" rx="10"/>
        <rect x="1020" y="500" width="92" height="54" rx="10"/>
        <rect x="1140" y="500" width="92" height="54" rx="10"/>
        <rect x="1020" y="590" width="92" height="54" rx="10"/>
        <rect x="1140" y="590" width="92" height="54" rx="10"/>
      </g>
    </g>

    <!-- entrance -->
    <g>
      <rect x="620" y="720" width="200" height="60" rx="14" fill="#FFFFFF" opacity="0.55"/>
      <rect x="660" y="690" width="120" height="110" rx="14" fill="#0B2C4D" opacity="0.22"/>
      <rect x="680" y="710" width="80" height="80" rx="12" fill="#0B2C4D" opacity="0.22"/>
    </g>

    <!-- trees -->
    <g opacity="0.95" filter="url(#softBlur)">
      <circle cx="260" cy="820" r="60" fill="#2FB47A"/>
      <circle cx="330" cy="835" r="52" fill="#1E8F62"/>
      <rect x="285" y="860" width="24" height="70" rx="10" fill="#6B4A2E" opacity="0.45"/>

      <circle cx="1320" cy="820" r="60" fill="#2FB47A"/>
      <circle cx="1390" cy="835" r="52" fill="#1E8F62"/>
      <rect x="1345" y="860" width="24" height="70" rx="10" fill="#6B4A2E" opacity="0.45"/>
    </g>
  </g>

  <!-- foreground bokeh (keeps background lively without text/logo) -->
  <g opacity="0.22" filter="url(#bokeh)">
    <circle cx="210" cy="920" r="70" fill="#FFFFFF"/>
    <circle cx="420" cy="870" r="52" fill="#E8FFF6"/>
    <circle cx="1680" cy="880" r="90" fill="#FFFFFF"/>
    <circle cx="1490" cy="940" r="60" fill="#EAF6FF"/>
    <circle cx="960" cy="980" r="120" fill="#FFFFFF"/>
  </g>

  <!-- clean login-card spotlight -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#cardSpot)"/>

  <!-- subtle vignette -->
  <rect x="0" y="0" width="1920" height="1080" fill="#0A1F3A" opacity="0.10"/>
</svg>
